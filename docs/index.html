
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空案内人復習サイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>黄道十二星座</h1>

    <div class="card">
        <h2>おひつじ座</h2>
        <p>一等星: ハマル</p>
        <p>見頃: 秋</p>
        <p>神話: 金の羊にまつわる神話</p>
        <details>
            <summary>観測ポイントを見る</summary>
            <p>秋の四辺形（ペガスス座）」の東側に広がるアンドロメダ座の南東、またはさんかく座の南側を探します。ひつじの頭にあたる「2等星ハマル」と、そのすぐ隣にある「3等星シェラタン」が並んでいるのが最大の目印です。この2つの星と周りの暗い星をあわせて、カタカナの「へ」の字のように見えます。</p>
        </details>
    </div>
    
    <div class="card">
        <h2>おうし座</h2>
        <p>一等星: アルデバラン</p>
        <p>見頃: 冬</p>
        <p>神話: ゼウスが変身した牡牛の神話</p>
        <details>
            <summary>観測ポイントを見る</summary>
            <p>プレアデス星団（すばる）やヒアデス星団を楽しめる</p>
        </details>
    </div>
    
</body>
</html>
